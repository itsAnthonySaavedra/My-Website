<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    text {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 65px;
      fill: black;
      stroke: white;
      stroke-width: 2px;
      paint-order: stroke;
    }
    @media (prefers-color-scheme: dark) {
      text {
        fill: white;
        stroke: black;
      }
    }
  </style>
  <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle">AS.</text>
</svg>
