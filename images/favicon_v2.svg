<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .text {
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: 70px; /* Adjusted size */
      text-anchor: middle;
      dominant-baseline: central; /* Vertically centered */
      
      /* Default: Black Text with White border (Visible on Light/Dark) */
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 5px; /* Thick stroke */
      paint-order: stroke; /* Stroke behind text */
    }
    
    @media (prefers-color-scheme: dark) {
      .text {
        /* Dark Mode: White Text with Black border */
        fill: #ffffff;
        stroke: #000000;
      }
    }
  </style>
  <text x="50" y="55" class="text">AS.</text>
</svg>
